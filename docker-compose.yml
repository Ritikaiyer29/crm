# Local container smoke test. There is no local Postgres service here on
# purpose: the real database is the hosted Supabase instance (DATABASE_URL
# in .env), and docker-compose would otherwise tempt someone into testing
# against an empty throwaway DB that doesn't match production.
services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8010:8000"
    env_file:
      - .env
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: http://localhost:8010
    ports:
      - "5173:80"
    depends_on:
      - api
