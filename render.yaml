# Render Blueprint. Review field names against Render's current docs before
# relying on this -- Render's schema shifts over time and this wasn't
# tested against a live Render deploy. It still saves re-entering every
# field by hand in the dashboard; adjust and go.
#
# Two services: the API and the frontend, both free on Render's web-service
# tier. The agent runner (Dockerfile.agents) is deliberately NOT deployed as
# a Render cron service here -- Render's cron jobs have a $1/month minimum
# even on the free plan. Run the agent sweeps manually instead (locally, or
# `docker run --env-file .env <image> python run_triage.py` against the prod
# DATABASE_URL) whenever you want fresh proposals. See DEPLOY.md.
#
# Secrets (DATABASE_URL, GROQ_API_KEY, GROQ_API_KEY_2, JWT_SECRET) are left
# for manual entry in the Render dashboard rather than committed here.
services:
  - type: web
    name: novapay-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: ALLOWED_ORIGINS
        value: https://novapay-frontend.onrender.com

  - type: web
    name: novapay-frontend
    runtime: docker
    dockerfilePath: ./frontend/Dockerfile
    dockerContext: ./frontend
    plan: free
    envVars:
      - key: API_BASE_URL
        value: https://novapay-api.onrender.com
