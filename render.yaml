# Render Blueprint. Review field names against Render's current docs before
# relying on this -- Render's schema shifts over time and this wasn't
# tested against a live Render deploy. It still saves re-entering every
# field by hand in the dashboard; adjust and go.
#
# Three services, matched to the three deployables this repo actually
# produces: the API (always on), the frontend (always on, static-ish), and
# the agent runner (not a server -- runs on a schedule and exits).
#
# Secrets (DATABASE_URL, GROQ_API_KEY, GROQ_API_KEY_2, JWT_SECRET) are left
# for manual entry in the Render dashboard rather than committed here.
services:
  - type: web
    name: novapay-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: ALLOWED_ORIGINS
        value: https://novapay-frontend.onrender.com

  - type: web
    name: novapay-frontend
    runtime: docker
    dockerfilePath: ./frontend/Dockerfile
    dockerContext: ./frontend
    plan: free
    envVars:
      - key: API_BASE_URL
        value: https://novapay-api.onrender.com

  - type: cron
    name: novapay-agent-sweep
    runtime: docker
    dockerfilePath: ./Dockerfile.agents
    dockerContext: .
    plan: free
    schedule: "*/15 * * * *"
    dockerCommand: python run_followup_sweep.py
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: GROQ_API_KEY
        sync: false
